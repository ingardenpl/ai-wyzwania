<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Schemat neuronu McCullocha i Pittsa z progiem aktywacji" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>Schemat neuronu McCullocha i Pittsa z progiem aktywacji</title>
<defs>
<marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker>
<marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a1538"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a7f7a"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8661a"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="558" rx="18" fill="#fbfaf7" stroke="#d6d0c4" stroke-width="2"/>
<text x="600.0" y="46.0" font-size="26" fill="#1f3a5f" text-anchor="middle" font-weight="bold">Neuron McCullocha i Pittsa (1943): logika zamiast biologii</text>
<circle cx="170.0" cy="150.0" r="34" fill="#dfe7f1" stroke="#1f3a5f" stroke-width="2"/>
<text x="170.0" y="158.0" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">x₁</text>
<text x="95.0" y="158.0" font-size="24" fill="#1d1d1f" text-anchor="middle" font-weight="bold">1</text>
<line x1="206.0" y1="150.0" x2="506.0" y2="228.0" stroke="#1f3a5f" stroke-width="3" marker-end="url(#aN)"/>
<circle cx="170.0" cy="270.0" r="34" fill="#dfe7f1" stroke="#1f3a5f" stroke-width="2"/>
<text x="170.0" y="278.0" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">x₂</text>
<text x="95.0" y="278.0" font-size="24" fill="#1d1d1f" text-anchor="middle" font-weight="bold">1</text>
<line x1="206.0" y1="270.0" x2="506.0" y2="270.0" stroke="#1f3a5f" stroke-width="3" marker-end="url(#aN)"/>
<circle cx="170.0" cy="390.0" r="34" fill="#dfe7f1" stroke="#1f3a5f" stroke-width="2"/>
<text x="170.0" y="398.0" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">x₃</text>
<text x="95.0" y="398.0" font-size="24" fill="#1d1d1f" text-anchor="middle" font-weight="bold">0</text>
<line x1="206.0" y1="390.0" x2="506.0" y2="312.0" stroke="#1f3a5f" stroke-width="3" marker-end="url(#aN)"/>
<circle cx="600.0" cy="270.0" r="90" fill="#f6e2e7" stroke="#8a1538" stroke-width="3"/>
<text x="600.0" y="252.0" font-size="22" fill="#1d1d1f" text-anchor="middle" font-weight="bold">suma = 2</text>
<text x="600.0" y="284.0" font-size="22" fill="#8a1538" text-anchor="middle" font-weight="bold">próg θ = 2</text>
<text x="600.0" y="314.0" font-size="19" fill="#1d1d1f" text-anchor="middle" font-weight="normal">2 ≥ 2 → „tak”</text>
<line x1="692.0" y1="270.0" x2="898.0" y2="270.0" stroke="#8a1538" stroke-width="3" marker-end="url(#aM)"/>
<rect x="905.0" y="234.0" width="160.0" height="72.0" rx="12" fill="#f6e2e7" stroke="#8a1538" stroke-width="2"/>
<text x="985.0" y="279.0" font-size="22" fill="#8a1538" text-anchor="middle" font-weight="bold">wyjście: 1</text>
<text x="140.0" y="455.0" font-size="18" fill="#555555" text-anchor="middle" font-weight="normal">wejścia: tylko 0 lub 1</text>
<text x="600.0" y="405.0" font-size="18" fill="#555555" text-anchor="middle" font-weight="normal">neuron „odpala”, gdy suma wejść osiąga próg</text>
<text x="600.0" y="500.0" font-size="18" fill="#1d1d1f" text-anchor="middle" font-weight="normal">Analogia prawnicza: skutek prawny następuje, gdy spełnione są wymagane przesłanki (tu: 2 z 2).</text>
<text x="600.0" y="532.0" font-size="16" fill="#555555" text-anchor="middle" font-weight="normal" font-style="italic">Wagi i progi są stałe: taki neuron niczego się nie uczy, ale sieć takich neuronów liczy funkcje logiczne.</text>
</svg>

<circle cx="990.0" cy="430.0" r="20" fill="#8a1538" stroke="#8a1538" stroke-width="2"/>
<rect x="972.0" y="152.0" width="36.0" height="36.0" rx="2" fill="#fbfaf7" stroke="#1f3a5f" stroke-width="4"/>
<text x="860.0" y="300.0" font-size="18" fill="#8a1538" text-anchor="middle" font-weight="bold">żadna prosta</text><text x="860.0" y="324.0" font-size="18" fill="#8a1538" text-anchor="middle" font-weight="bold">nie oddzieli ● od □</text>
<text x="600.0" y="560.0" font-size="16" fill="#555555" text-anchor="middle" font-weight="normal" font-style="italic">● = wynik „tak”, □ = wynik „nie”. Rozwiązanie: kilka warstw neuronów i metoda ich trenowania (propagacja wsteczna, 1986).</text>

<title id="t">AI Act: podejście oparte na ryzyku</title><desc id="d"> Ryzyko niedopuszczalne: praktyki zakazane (art. 5); Wysokie ryzyko: wymogi i ocena zgodności (art. 6, zał. I i III); Obowiązki przejrzystości: czatboty, deepfake, treści syntetyczne (art. 50); Ryzyko minimalne: brak nowych obowiązków, kodeksy dobrowolne; Modele GPAI: odrębny reżim dla dostawców modeli ogólnego przeznaczenia (art. 51–55)</desc>

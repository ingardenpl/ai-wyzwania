<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 570" width="1400" height="570" role="img" aria-label="Mechanizm uwagi: wagi powiązań słowa on z wcześniejszymi słowami" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>Mechanizm uwagi: wagi powiązań słowa on z wcześniejszymi słowami</title>
<defs>
